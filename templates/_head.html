{# Shared <head> bits: stylesheet, the global theme's fonts, and the theme's
   token overrides. Included by every page so a theme change repaints the whole
   app (master and player alike) with no per-template work.

   The <style> block comes AFTER style.css so its :root wins the cascade.

   Both values are marked |safe because they are CSS and a URL, not HTML, and
   theming.py builds them from a fixed table -- no user input reaches them.
   Without |safe, Jinja escapes the quotes in font names to &#39; and the &
   separators in the fonts URL to &amp;. That silently kills the fonts while
   leaving the (quote-free) colours working. #}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ theme_fonts_url | safe }}">
{# CSRF: the per-session token, exposed once here for the whole app.
   * The <meta> lets fetch()/XHR callers (the interactive map) read it and send
     it back in an X-CSRF-Token header.
   * The inline script auto-injects a hidden csrf_token field into every POST
     form at submit time, so no individual <form> has to remember it and a new
     form can never ship unprotected. GET forms are left alone. See
     handouts/security.py for the server-side check. #}
<meta name="csrf-token" content="{{ csrf_token }}">
<script>
(function () {
    var token = "{{ csrf_token }}";
    // 1) Auto-inject a hidden csrf_token into every POST <form> at submit time.
    document.addEventListener("submit", function (e) {
        var form = e.target;
        if (!form || form.method.toLowerCase() !== "post") return;
        if (form.querySelector('input[name="csrf_token"]')) return;
        var input = document.createElement("input");
        input.type = "hidden";
        input.name = "csrf_token";
        input.value = token;
        form.appendChild(input);
    }, true);

    // 2) Add the X-CSRF-Token header to same-origin, state-changing fetch()
    //    calls (the interactive map posts JSON via fetch, not a form). We wrap
    //    fetch once here so no call site has to remember the header. GET/HEAD
    //    are left untouched, and cross-origin requests are never given the
    //    token.
    var SAFE = { GET: 1, HEAD: 1, OPTIONS: 1, TRACE: 1 };
    var nativeFetch = window.fetch;
    if (nativeFetch) {
        window.fetch = function (input, init) {
            init = init || {};
            var method = (init.method
                || (input && input.method)
                || "GET").toUpperCase();
            var url = (typeof input === "string") ? input
                : (input && input.url) || "";
            var sameOrigin = url.indexOf("http") !== 0
                || url.indexOf(window.location.origin) === 0;
            if (!SAFE[method] && sameOrigin) {
                var headers = new Headers(init.headers || (input && input.headers) || {});
                if (!headers.has("X-CSRF-Token")) headers.set("X-CSRF-Token", token);
                init = Object.assign({}, init, { headers: headers });
            }
            return nativeFetch.call(this, input, init);
        };
    }
})();
</script>
<style>{{ theme_css | safe }}</style>
<style>
    /* ---- Shared site footer (see templates/_footer.html) ---- */
    .site-footer {
        margin-top: 32px; padding: 14px 16px;
        border-top: 1px solid var(--border, #6b4f34);
        color: var(--ink-dim, #b8a888); font-size: 0.8rem;
        display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    }
    .site-footer__nav { display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .site-footer__nav a {
        color: var(--ink-dim, #b8a888); text-decoration: none;
        border-bottom: 1px dotted transparent;
    }
    .site-footer__nav a:hover { color: var(--accent, #e8a83a); border-bottom-color: currentColor; }
    .site-footer__status { margin-left: auto; display: flex; align-items: center; gap: 14px; }
    .site-footer__server { display: inline-flex; align-items: center; gap: 6px; }
    .server-dot {
        width: 8px; height: 8px; border-radius: 50%;
        background: var(--ink-dim, #b8a888); box-shadow: 0 0 4px currentColor;
    }
    .site-footer.is-online .server-dot { background: var(--good, #3ba55d); color: var(--good, #3ba55d); }
    .site-footer.is-offline .server-dot { background: var(--danger, #a33); color: var(--danger, #a33); }
    /* Full footer (home + dashboard): credits block spans the row. */
    .site-footer--full { flex-direction: column; align-items: stretch; }
    .site-footer--full .site-footer__status { margin-left: 0; }
    .site-footer__credits { line-height: 1.5; }
    .site-footer__credits p { margin: 0 0 6px; }
    .site-footer__thanks { color: var(--ink-dim, #b8a888); }
    .site-footer__gh a {
        color: var(--accent, #e8a83a); text-decoration: none;
        border-bottom: 1px dotted currentColor;
    }
    .site-footer__gh a:hover { filter: brightness(1.15); }
    .site-footer--full .site-footer__nav,
    .site-footer--full .site-footer__status { padding-top: 6px; }

    /* ---- Passphrase warning: a discreet-but-persistent pebble ---- */
    .passphrase-nag {
        position: fixed; right: 12px; bottom: 12px; z-index: 900;
        max-width: 260px; padding: 8px 30px 8px 10px;
        background: var(--danger, #a33); color: #fff;
        border: 2px solid #000; box-shadow: 3px 3px 0 0 rgba(0,0,0,0.4);
        font-size: 0.76rem; line-height: 1.35;
        opacity: 0.9;
    }
    .passphrase-nag a { color: #fff; font-weight: bold; text-decoration: underline; }
    .passphrase-nag__x {
        position: absolute; top: 2px; right: 6px;
        background: none; border: none; color: #fff; cursor: pointer;
        font-size: 1rem; line-height: 1; padding: 2px;
    }
    .passphrase-nag[hidden] { display: none; }
</style>
